services:
  postgres:
    image: postgres:16-alpine
    container_name: questboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-questboard}
      POSTGRES_USER: ${POSTGRES_USER:-quest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quest123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quest}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [questboard]

  redis:
    image: redis:7-alpine
    container_name: questboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [questboard]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: questboard-backend:latest
    container_name: questboard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-questboard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quest}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quest123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-at-least-32-chars}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-change-me}
      JIRA_WEBHOOK_TOKEN: ${JIRA_WEBHOOK_TOKEN:-change-me}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"
    networks: [questboard]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: questboard-frontend:latest
    container_name: questboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks: [questboard]

volumes:
  postgres_data:
  redis_data:

networks:
  questboard:
    driver: bridge