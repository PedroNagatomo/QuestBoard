server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: questboard
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/questboard}
    username: ${SPRING_DATASOURCE_USERNAME:quest}
    password: ${SPRING_DATASOURCE_PASSWORD:quest123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
      thread-name-prefix: questboard-async-

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-very-long-secret-key-min-32-chars}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  integrations:
    github:
      webhook-secret: ${GITHUB_WEBHOOK_SECRET:change-me}
      enabled: true
    jira:
      webhook-token: ${JIRA_WEBHOOK_TOKEN:change-me}
      enabled: true
    trello:
      enabled: true
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      enabled: false

  xp:
    level-base: 100
    level-exponent: 1.5
    max-level: 100

  anti-cheat:
    max-quests-per-hour: 10
    min-seconds-to-complete: 30
    xp-daily-cap: 5000

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.questboard: DEBUG
    org.springframework.security: INFO